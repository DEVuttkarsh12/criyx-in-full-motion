<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Criyx responsive review</title>
<style>body{margin:0;background:#dce2ea;color:#13243a;font:14px system-ui}header{height:56px;display:flex;align-items:center;justify-content:center;gap:16px}select{padding:6px}iframe{display:block;margin:0 auto;background:white;border:0;width:390px;height:844px;max-width:100%}</style>
<header><label>Review width <select id="width"><option value="390">390px mobile</option><option value="768">768px tablet</option><option value="1280">1280px desktop</option></select></label><label>Section <select id="section"><option value="top">Hero</option><option value="systems">Capabilities</option><option value="work">Industries</option><option value="about">About</option><option value="approach">Process</option><option value="questions">FAQ</option><option value="contact">Contact</option></select></label></header>
<iframe title="Criyx responsive preview" src="/"></iframe>
<script>document.querySelector('#width').addEventListener('change',e=>{document.querySelector('iframe').style.width=e.target.value+'px'});document.querySelector('#section').addEventListener('change',e=>{document.querySelector('iframe').contentWindow.location.hash=e.target.value})</script>
</html>
